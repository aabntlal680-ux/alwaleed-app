workflows:
  expo-android:
    name: Alwaleed Expo Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: | 
          npm install
      - name: Install Expo CLI
        script: |
          npm install -g expo-cli
      - name: Build Web Artifacts
        script: |
          # بما أن مشروعك يحتوي على react-native-web، سنقوم ببناء نسخة الويب أولاً للتأكد
          npx expo export -p web
